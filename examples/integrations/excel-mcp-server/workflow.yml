name: Behavioral Regression Check (mcp-behave)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-behave-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mcp-behave==0.5.7 and target
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev strace
          pip install mcp-behave==0.5.7
          python -m venv /tmp/target-venv
          /tmp/target-venv/bin/pip install "excel-mcp-server==2.3.7"
      - name: Run audit and baseline check with synthetic workbook fixture
        run: |
          cp -r examples/integrations/excel-mcp-server/fixture/workbooks /tmp/excel_work
          mcp-behave --json --no-dns --probe-rounds 2 --fail-on high \
            -- /tmp/target-venv/bin/excel-mcp-server stdio --allow-dir /tmp/excel_work/allowed > audit.json
          mcp-behave init --lockfile /tmp/mcp-behave.lock --probe-rounds 1 \
            -- /tmp/target-venv/bin/excel-mcp-server stdio --allow-dir /tmp/excel_work/allowed
          mcp-behave check --lockfile /tmp/mcp-behave.lock --probe-rounds 1 --json \
            -- /tmp/target-venv/bin/excel-mcp-server stdio --allow-dir /tmp/excel_work/allowed > check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-behave-excel
          path: |
            audit.json
            check.json
