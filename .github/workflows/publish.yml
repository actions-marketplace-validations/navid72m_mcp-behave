
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@11

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [ "$(npm view "mcp-behave@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "Version $VERSION already exists on npm."
          else
            npm publish --access public
          fi

  publish-mcp-registry:
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mcp-publisher
          sudo chmod +x /usr/local/bin/mcp-publisher

      - name: Authenticate with MCP Registry
        run: mcp-publisher login github-oidc

      - name: Wait for package registries
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')

          for i in {1..30}; do
            NPM_VER=$(npm view "mcp-behave@$VERSION" version 2>/dev/null || true)

            PYPI_VER=$(curl -fsSL "https://pypi.org/pypi/mcp-behave/$VERSION/json" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" \
              2>/dev/null || true)

            echo "Attempt $i/30: Target=$VERSION npm=$NPM_VER PyPI=$PYPI_VER"

            if [ "$NPM_VER" = "$VERSION" ] && [ "$PYPI_VER" = "$VERSION" ]; then
              echo "Both packages are available."
              exit 0
            fi

            sleep 10
          done

          echo "Error: Package replication timeout." >&2
          exit 1

      - name: Publish to MCP Registry
        run: mcp-publisher publish server.json

