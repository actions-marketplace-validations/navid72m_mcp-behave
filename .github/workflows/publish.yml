name: publish

# Triggered by pushing a version tag like v0.1.0 or manually via workflow_dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # required for Trusted Publishers OIDC

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin mcp-publisher
          sudo chmod +x /usr/local/bin/mcp-publisher
      - name: Authenticate with MCP Registry
        run: mcp-publisher login github-oidc
      - name: Wait for package registries replication
        run: |
          echo "Waiting for package registries (npm & PyPI) to replicate globally..."
          TAG_VER="${GITHUB_REF_NAME#v}"
          for i in {1..18}; do
            NPM_VER=$(npm view mcp-behave version --registry=https://registry.npmjs.org/ 2>/dev/null || true)
            PYPI_VER=$(curl -fsSL https://pypi.org/pypi/mcp-behave/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || true)
            echo "Attempt $i/18: Target=$TAG_VER, npm=$NPM_VER, PyPI=$PYPI_VER"
            if [ "$NPM_VER" = "$TAG_VER" ] && [ "$PYPI_VER" = "$TAG_VER" ]; then
              echo "Both npm and PyPI show version $TAG_VER! Ready to publish to MCP Registry."
              exit 0
            fi
            sleep 10
          done
          echo "Error: Timed out waiting for npm and PyPI to replicate version $TAG_VER." >&2
          exit 1
      - name: Publish to MCP Registry
        run: mcp-publisher publish server.json
