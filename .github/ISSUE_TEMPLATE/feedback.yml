name: "User Feedback & Experience Survey"
description: "Share your experience with mcp-behave, report usability friction, or request new security capabilities."
title: "[Feedback]: "
labels: ["feedback", "community-survey"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for helping improve `mcp-behave`! 🛡️
        Whether you are testing reference servers, developing internal MCP tools, or auditing multi-server AI agent environments, your feedback directly shapes our detection engine and roadmap.

        *Prefer a web form?* You can also use our [Interactive Web Survey](https://navid72m.github.io/mcp-behave/survey.html).

  - type: dropdown
    id: role
    attributes:
      label: "What is your primary role or use case?"
      description: "Select the profile that best describes your work."
      options:
        - "Security Auditor / Penetration Tester"
        - "MCP Server Author / Maintainer"
        - "AI Agent / Client Developer (Claude Desktop, Cursor, Cline, etc.)"
        - "Enterprise Platform / DevSecOps Engineer"
        - "Academic / Security Researcher"
        - "Open Source Contributor / Enthusiast"
        - "Other"
    validations:
      required: true

  - type: checkboxes
    id: tracers-used
    attributes:
      label: "Which tracer backend(s) or environments do you use?"
      description: "Select all that apply."
      options:
        - label: "Linux strace (`--tracer strace`)"
        - label: "macOS DYLD interposition (`--tracer libc`)"
        - label: "Linux LD_PRELOAD interposition (`--tracer libc`)"
        - label: "Experimental Linux eBPF kernel tracepoints (`--tracer ebpf`)"
        - label: "Docker container (`docker run ... mcp-behave`)"
        - label: "Windows / WSL2"

  - type: checkboxes
    id: targets-tested
    attributes:
      label: "What kinds of MCP servers have you audited with mcp-behave?"
      description: "Select all that apply."
      options:
        - label: "Official reference servers (e.g. Git, Filesystem, Fetch, Memory)"
        - label: "Community / open-source MCP servers"
        - label: "Proprietary internal / company enterprise tools"
        - label: "AI Agent dynamic tool runners / code interpreters"

  - type: dropdown
    id: rating
    attributes:
      label: "Overall rating of mcp-behave"
      description: "How would you rate your overall experience so far?"
      options:
        - "⭐⭐⭐⭐⭐ 5 - Excellent (Fast, caught real security issues, clear report)"
        - "⭐⭐⭐⭐ 4 - Very Good (Useful, minor setup or documentation friction)"
        - "⭐⭐⭐ 3 - Good (Promising, needs more tracer support or features)"
        - "⭐⭐ 2 - Fair (Hit unexpected errors, false positives, or confusing output)"
        - "⭐ 1 - Poor (Did not work as expected)"
    validations:
      required: true

  - type: checkboxes
    id: wishlist
    attributes:
      label: "What features or improvements are highest priority for you?"
      description: "Select up to 3 features that would provide the most value."
      options:
        - label: "Production eBPF backend with automated kernel probe loading"
        - label: "GitHub Action for automated CI/CD PR security checks & gating"
        - label: "Custom policy YAML rules (CIDR egress allowlist, path deny rules)"
        - label: "Interactive HTML reports with syscall timeline visualizations"
        - label: "Native Windows syscall tracing (ETW / Windows filtering)"
        - label: "Multi-turn autonomous adversarial fuzzing & stateful exploit generation"
        - label: "Enhanced static schema linting & false-positive elimination"

  - type: textarea
    id: experience
    attributes:
      label: "What worked well? What was confusing or frustrating?"
      description: "Tell us about your experience installing, running, and interpreting findings."
      placeholder: "e.g., Installation was seamless, but I was unsure what a score of 60 meant for filesystem confinement..."
    validations:
      required: false

  - type: textarea
    id: false-positives-or-bugs
    attributes:
      label: "Did you encounter any false positives, crashes, or quirks?"
      description: "If an honest tool was flagged unexpectedly or a command failed, let us know."
      placeholder: "Tool name, advertised description, and observed finding..."
    validations:
      required: false

  - type: textarea
    id: other-ideas
    attributes:
      label: "Any other suggestions, ideas, or feedback?"
      placeholder: "Anything else you'd like the maintainers to know..."
    validations:
      required: false
