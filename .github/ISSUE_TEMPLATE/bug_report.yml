name: Bug report
description: Report a reproducible problem with mcp-behave.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Do not include API keys, passwords, private keys, access tokens, or unredacted production data.** For a suspected security vulnerability, use [private vulnerability reporting](https://github.com/navid72m/mcp-behave/security/advisories/new) instead of this public form.

  - type: input
    id: version
    attributes:
      label: mcp-behave version
      description: Include the version or commit you are using.
      placeholder: "e.g. 0.5.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.2 or not applicable"
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - pip
        - uv / uvx
        - npm / npx
        - Editable source checkout
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and relevant configuration
      description: Paste the command and a minimal, redacted configuration. Remove secrets and private paths.
      render: shell
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, credentials, personal data, and sensitive filesystem paths before posting.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar report.
          required: true
        - label: I removed secrets and sensitive information from this report.
          required: true
