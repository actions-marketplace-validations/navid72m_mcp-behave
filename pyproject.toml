[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-behave"
version = "0.3.5"
description = "Runtime behavioral auditor for MCP servers — scope-violation detection via native libc interposition & runtime tracing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Navid Mirnoori Langeroudi", email = "navid72m@gmail.com" },
]
keywords = ["mcp", "security", "agents", "auditing", "tracer", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/navid72m/mcp-behave"
Issues = "https://github.com/navid72m/mcp-behave/issues"

[project.scripts]
mcp-behave = "mcp_behave.cli:main"
mcp-behave-server = "mcp_behave.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_behave"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
